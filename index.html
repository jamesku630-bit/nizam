<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8"/>

  <meta name="viewport"
  content="width=device-width, initial-scale=1.0"/>

  <title>Birthday Web</title>

  <!-- PIXEL FONT -->

  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
  rel="stylesheet">

  <!-- FONT FORM 2 -->

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap"
  rel="stylesheet">

  <link rel="stylesheet" href="brithday.css">

</head>

<body>

 <audio id="bgMusic" loop>
  <source src="assestt/shape.mp3" type="audio/mp3">
</audio>

  <!-- ================= FORM 1 ================= -->

  <div class="container" id="form1">

    <!-- CLOUD -->

    <img src="assestt/cloudpixel.png"
    class="cloud cloud1">

    <img src="assestt/cloudpixel.png"
    class="cloud cloud2">

    <img src="assestt/cloudpixel.png"
    class="cloud cloud3">

    <!-- LOVE GIF -->

    <img src="assestt/gif.gif"
    class="love love1">

    <img src="assestt/gif.gif"
    class="love love2">

    <img src="assestt/gif.gif"
    class="love love3">

    <img src="assestt/gif.gif"
    class="love love4">

    <!-- LEFT -->

    <div class="left-content">

      <img src="assestt/Game Love Sticker.gif"
      class="small-duck">

      <h1 id="typingText"></h1>

      <button id="openBtn">
        click me !
      </button>

    </div>

    <!-- RIGHT -->

    <div class="right-content">

      <img src="assestt/Happy Pixel Sticker.gif"
      class="big-duck">

    </div>

  </div>

  <!-- ================= FORM 2 ================= -->

  <div class="gift-page" id="form2">

    <!-- CLOUD -->

    <img src="assestt/cloud.png"
    class="gift-cloud gift-cloud1">

    <img src="assestt/cloud.png"
    class="gift-cloud gift-cloud2">

    <img src="assestt/cloud.png"
    class="gift-cloud gift-cloud3">

    <img src="assestt/cloud.png"
    class="gift-cloud gift-cloud4">

    <!-- CONTENT -->
    <div class="gift-content">

      <img src="assestt/Game Love Sticker by Stephanie Poetri.gif"
    class="gift-love gift-love1">

    <img src="assestt/Game Love Sticker by Stephanie Poetri.gif"
    class="gift-love gift-love2">

    <img src="assestt/Game Love Sticker by Stephanie Poetri.gif"
    class="gift-love gift-love3">

    <img src="assestt/Game Love Sticker by Stephanie Poetri.gif"
    class="gift-love gift-love4">

    <!-- LOVE BARU -->

    <img src="assestt/Heart Love Sticker by Princess Polly Boutique.gif"
    class="gift-love gift-love5">

    <img src="assestt/Heart Love Sticker by Princess Polly Boutique.gif"
    class="gift-love gift-love6">

    <!-- FLOWER -->

    <img src="assestt/flowers STICKER.gif"
    class="bottom-flower flower-left">

    <!-- ROSE PETALS -->
    <img src="assestt/Rose Petals Art Sticker.gif"
    class="right-flower">

      <!-- TITLE -->

      <h2 class="gift-title">
        You have a <br>
        GIFT!
      </h2>

      <!-- OPEN BUTTON -->

      <button id="giftBtn"
      class="gift-button">
        open gift ?
      </button>

      <!-- OPENING TEXT -->

      <h3 id="openingText"></h3>

      <!-- CAT -->

      <img src="assestt/Black Cat Sticker.gif"
      class="cat-gif"
      id="catGif">

      <!-- GIFT GIF -->

      <img src="assestt/Gift Sticker by Iris Tattoo.gif"
      class="gift-box-gif"
      id="giftGif">

      <!-- CHECK BUTTON -->

      <button id="checkBtn"
      class="gift-button">
        check it out!
      </button>

    </div>

  </div>

  <!-- ================= FORM 3 ================= -->

<div class="birthday-page" id="form3">

  <!-- BALLOON -->

  <img src="assestt/Balloon Love Sticker by Folksy.gif"
  class="balloon balloon-left">

  <img src="assestt/Balloon Love Sticker by Folksy.gif"
  class="balloon balloon-right">

  <img src="assestt/Heart Love Sticker by Folksy.gif"
  class="birthday-love birthday-love1">

  <img src="assestt/Heart Love Sticker by Folksy.gif"
  class="birthday-love birthday-love2">

  <img src="assestt/Heart Love Sticker by Folksy.gif"
  class="birthday-love birthday-love3">

  <img src="assestt/Summer Sea Sticker.gif"
  class="summer summer1">

  <img src="assestt/Summer Sea Sticker.gif"
  class="summer summer2">

  <!-- CONTENT -->

  <div class="birthday-content">

    <!-- TEXT -->

    <h2 class="birthday-title"
    id="birthdayText"></h2>

    <!-- HELLO KITTY -->

    <img src="assestt/Hello Kitty Pixel Sticker.gif"
    class="sanrio-gif">

    <!-- CAKE -->

    <img src="assestt/Happy Birthday Party Sticker by Amy.gif"
    class="birthday-cake">

    <!-- BUTTON -->

    <button id="nextBtn">
      next...
    </button>

  </div>

</div>

<!-- ================= FORM 4 ================= -->

<div class="snoopy-page" id="form4">

  <div class="snoopy-box">

    <!-- TEXT -->

    <h2 id="snoopyText"></h2>

    <!-- SNOOPY -->

    <img src="assestt/Excited The Peanuts Gang Sticker by Peanuts.gif"
    class="snoopy-walk"
    id="snoopyWalk">

    <!-- BUTTON -->

    <button id="snoopyNextBtn">
      next...
    </button>

  </div>

</div>

<!-- ================= FORM 5 ================= -->

<div class="letter-box">

    <div class="letter-top">

        <div class="left-side">

            <div class="from-text">
                from me...
            </div>

            <img src="kuromi.gif" class="kuromi-gif">

        </div>

        <div class="right-side">

            <div class="to-text">
                ...to you<br>jingga
            </div>

            <img src="melody.gif" class="melody-gif">

        </div>

    </div>

    <div class="love-message">
        So proud to have you...
    </div>

    <button id="letterBtn">
        click here
    </button>

</div>

</div>

  <script src="brithday.js"></script>

</body>
</html>
